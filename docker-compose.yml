services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: airmax
      POSTGRES_USER: airmax
      POSTGRES_PASSWORD: airmax_local
    ports: ["5432:5432"]
    volumes: ["airmax_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airmax"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    volumes: ["airmax_redis:/data"]
volumes:
  airmax_postgres:
  airmax_redis:
